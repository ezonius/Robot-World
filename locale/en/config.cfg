[mod-setting-description]
# enable-for-all-tiers=Enable this if you want to apply settings for all logistics robots, construction robots, and roboports. (ex, boblogistics)
robot-energy-tick-usage-multiplier=Mulitplier for amount of energy used when robots are not moving. 
roboport-buffer-multiplier=Multiplier for amount of energy stored in roboport
roboport-energy-usage-multiplier=Multiplier for amount of energy usage of roboport when idle
roboport-logistics-radius-multiplier=Roboport logistics radius multiplier. (this may cause problems with other mods)
roboport-construction-radius-multiplier=Roboport construction radius multiplier. (this may cause problems with other mods)
roboport-logistics-radius-value=-1 (default): use the vanilla logistics radius, then apply the radius multiplier. Any value >= 0: use that number as the base radius in tiles, then apply the radius multiplier. (i.e. final radius = base × multiplier) (this may cause problems with other mods)
roboport-construction-radius-value=-1 (default): use the vanilla construction radius, then apply the radius multiplier. Any value >= 0: use that number as the base radius in tiles, then apply the radius multiplier. (i.e. final radius = base × multiplier) (this may cause problems with other mods)
disable-mod-recipes=Disables cheap recipes and enables original recipes
enable-extra-robot-speed-research=Adds optional researchable duplicates of the pre-infinite Worker robot speed research (tiers 1-5). Each duplicate has the same cost, packs, effect and requirements as the tier it copies, and is never required by any other research.
extra-robot-speed-research-count=Total number of extra Worker robot speed research to add, one per tier starting at tier 1. Higher than 5? Additional duplicates start again from tier 1.
enable-extra-robot-storage-research=Adds optional researchable duplicates of the Worker robot cargo size research (tiers 1-3). Each duplicate has the same cost, packs, effect and requirements as the tier it copies, and is never required by any other research. Vanilla has no infinite cargo size research, so this simply extends the available research.
extra-robot-storage-research-count=Total number of extra Worker robot cargo size research to add, one per tier starting at tier 1. Higher than 3? Additional duplicates start again from tier 1.


[mod-setting-description]
# enable-for-all-tiers=Enable this if you want to apply settings for all logistics robots, construction robots, and roboports. (ex, boblogistics)
# --- Robot (applies to BOTH robot types) ---
robot-carry-size-multiplier=Applies to BOTH construction and logistics robots. Carry capacity (max payload) multiplier. Stacks multiplicatively with the type-specific carry size settings below: [font=default-bold]final carry = base × [color=blue]Robot[/color] × type-specific[/font]. Example: [color=blue]Robot[/color] 2 × [color=orange]Construction robot[/color] 3 = 6× carry for construction robots. 1 = vanilla.
robot-speed-multiplier=Applies to BOTH construction and logistics robots. Flying speed multiplier. Stacks multiplicatively with the type-specific speed settings: [font=default-bold]final speed = base × [color=blue]Robot[/color] × type-specific[/font]. Example: [color=blue]Robot[/color] 2 × [color=green]Logistics robot[/color] 3 = 6× speed for logistics robots. 1 = vanilla.
robot-battery-size-multiplier=Applies to BOTH construction and logistics robots. Battery (max energy) multiplier. Stacks multiplicatively with the type-specific battery settings: [font=default-bold]final battery = base × [color=blue]Robot[/color] × type-specific[/font]. Example: [color=blue]Robot[/color] 2 × [color=orange]Construction robot[/color] 2 = 4× battery for construction robots. 1 = vanilla.
robot-energy-usage-multiplier=Applies to BOTH construction and logistics robots. Energy used while flying (energy per move) multiplier. Stacks multiplicatively with the type-specific energy usage settings: [font=default-bold]final usage = base × [color=blue]Robot[/color] × type-specific[/font]. Example: [color=blue]Robot[/color] 2 × [color=green]Logistics robot[/color] 2 = 4× energy per move for logistics robots. 1 = vanilla.
robot-energy-tick-usage-multiplier=Applies to BOTH construction and logistics robots. Energy used while idle (energy per tick, when not moving) multiplier. Stacks multiplicatively with the type-specific idle usage settings: [font=default-bold]final idle usage = base × [color=blue]Robot[/color] × type-specific[/font]. Example: [color=blue]Robot[/color] 2 × [color=orange]Construction robot[/color] 2 = 4× idle usage for construction robots. 1 = vanilla.
robot-stack-size=NOT the carry capacity (that is the carry size multiplier above). This sets the item stack size: how many robot items fit in one inventory/chest slot. Applied to both the construction-robot and logistic-robot items (vanilla: 50).
robot-health-multiplier=Applies to BOTH construction and logistics robots. Health multiplier. This is the ONLY health setting - the Construction robot and Logistics robot groups have no health multiplier of their own, so it always applies alone: [font=default-bold]final health = base × [color=blue]Robot[/color][/font]. 1 = vanilla.
# --- Construction robot (applies to construction robots only, stacks with Robot) ---
construction-robot-carry-size-multiplier=Multiplier for the carry capacity of CONSTRUCTION robots only. Stacks multiplicatively with the [color=blue]Robot[/color] carry size setting: [font=default-bold]final carry = base × [color=blue]Robot[/color] × this[/font]. 1 = vanilla.
construction-robot-speed-multiplier=Multiplier for the flying speed of CONSTRUCTION robots only. Stacks multiplicatively with the [color=blue]Robot[/color] speed setting: [font=default-bold]final speed = base × [color=blue]Robot[/color] × this[/font]. 1 = vanilla.
construction-robot-battery-size-multiplier=Multiplier for the battery (max energy) of CONSTRUCTION robots only. Stacks multiplicatively with the [color=blue]Robot[/color] battery setting: [font=default-bold]final battery = base × [color=blue]Robot[/color] × this[/font]. 1 = vanilla.
construction-robot-energy-usage-multiplier=Multiplier for the energy used while flying of CONSTRUCTION robots only. Stacks multiplicatively with the [color=blue]Robot[/color] energy usage setting: [font=default-bold]final usage = base × [color=blue]Robot[/color] × this[/font]. 1 = vanilla.
construction-robot-energy-tick-usage-multiplier=Multiplier for the idle energy (per tick, when not moving) of CONSTRUCTION robots only. Stacks multiplicatively with the [color=blue]Robot[/color] idle usage setting: [font=default-bold]final idle usage = base × [color=blue]Robot[/color] × this[/font]. 1 = vanilla.
# --- Logistics robot (applies to logistics robots only, stacks with Robot) ---
logistics-robot-carry-size-multiplier=Multiplier for the carry capacity of LOGISTICS robots only. Stacks multiplicatively with the [color=blue]Robot[/color] carry size setting: [font=default-bold]final carry = base × [color=blue]Robot[/color] × this[/font]. 1 = vanilla.
logistics-robot-speed-multiplier=Multiplier for the flying speed of LOGISTICS robots only. Stacks multiplicatively with the [color=blue]Robot[/color] speed setting: [font=default-bold]final speed = base × [color=blue]Robot[/color] × this[/font]. 1 = vanilla.
logistics-robot-battery-size-multiplier=Multiplier for the battery (max energy) of LOGISTICS robots only. Stacks multiplicatively with the [color=blue]Robot[/color] battery setting: [font=default-bold]final battery = base × [color=blue]Robot[/color] × this[/font]. 1 = vanilla.
logistics-robot-energy-usage-multiplier=Multiplier for the energy used while flying of LOGISTICS robots only. Stacks multiplicatively with the [color=blue]Robot[/color] energy usage setting: [font=default-bold]final usage = base × [color=blue]Robot[/color] × this[/font]. 1 = vanilla.
logistics-robot-energy-tick-usage-multiplier=Multiplier for the idle energy (per tick, when not moving) of LOGISTICS robots only. Stacks multiplicatively with the [color=blue]Robot[/color] idle usage setting: [font=default-bold]final idle usage = base × [color=blue]Robot[/color] × this[/font]. 1 = vanilla.
roboport-buffer-multiplier=Multiplier for amount of energy stored in roboport
roboport-energy-usage-multiplier=Multiplier for amount of energy usage of roboport when idle
roboport-logistics-radius-multiplier=Roboport logistics radius multiplier. (this may cause problems with other mods)
roboport-construction-radius-multiplier=Roboport construction radius multiplier. (this may cause problems with other mods)
roboport-logistics-radius-value=-1 (default): use the vanilla logistics radius, then apply the radius multiplier. Any value >= 0: use that number as the base radius in tiles, then apply the radius multiplier. (i.e. final radius = base × multiplier) (this may cause problems with other mods)
roboport-construction-radius-value=-1 (default): use the vanilla construction radius, then apply the radius multiplier. Any value >= 0: use that number as the base radius in tiles, then apply the radius multiplier. (i.e. final radius = base × multiplier) (this may cause problems with other mods)
disable-mod-recipes=Disables cheap recipes and enables original recipes
enable-extra-robot-speed-research=Adds optional researchable duplicates of the pre-infinite Worker robot speed research (tiers 1-5). Each duplicate has the same cost, packs, effect and requirements as the tier it copies, and is never required by any other research.
extra-robot-speed-research-count=Total number of extra Worker robot speed research to add, one per tier starting at tier 1. Higher than 5? Additional duplicates start again from tier 1.
enable-extra-robot-storage-research=Adds optional researchable duplicates of the Worker robot cargo size research (tiers 1-3). Each duplicate has the same cost, packs, effect and requirements as the tier it copies, and is never required by any other research. Vanilla has no infinite cargo size research, so this simply extends the available research.
extra-robot-storage-research-count=Total number of extra Worker robot cargo size research to add, one per tier starting at tier 1. Higher than 3? Additional duplicates start again from tier 1.

